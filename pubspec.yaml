name: build_up
description: "A new Flutter project."
publish_to: 'none'

version: 1.1.3

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  flutter_riverpod: ^3.4.3
  google_fonts: ^8.2.1
  permission_handler: ^13.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  firebase_auth: ^6.7.0
  google_sign_in: ^7.2.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.0
  flutter_timezone: ^5.1.0
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  printing: ^5.14.3
  pdf: ^3.12.0
  cloud_firestore:
  home_widget:
  google_maps_flutter: ^2.18.0
  fl_chart: ^1.2.0
  health: ^13.3.2
  flutter_launcher_icons: ^0.14.4
  workmanager: ^0.10.9
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/img.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/img.png"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/

dependency_overrides:
  permission_handler_android: 13.0.1
