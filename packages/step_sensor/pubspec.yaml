name: step_sensor
description: Reads the Android hardware step counter on any Flutter engine, including the WorkManager background engine.
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.nexappra.stepsensor
        pluginClass: StepSensorPlugin
